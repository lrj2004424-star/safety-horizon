name: Candidate regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            lock: requirements.lock
          - os: windows-latest
            lock: requirements-windows.lock
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked dependencies
        run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      - name: Dependency consistency
        run: python -m pip check
      - name: Regression (no hardware)
        run: python horizon.py test
      - name: Official model checksums
        run: python scripts/setup_assets.py --download-models
      - name: Actual model inference (synthetic, no hardware)
        run: python scripts/smoke_models.py
      - name: Actual local video pipeline (synthetic, no alerts)
        run: python scripts/smoke_video.py
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'platforms/windows/01_install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
